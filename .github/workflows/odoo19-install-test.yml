name: Odoo 19 Module Install Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/ra-billing-customer-invoice-odoo19"]

jobs:
  install-module:
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0
      # The Odoo image defaults to the unprivileged "odoo" user. GitHub's
      # checkout action must write runner command files, so run the job as root
      # and explicitly drop privileges for the Odoo server command below.
      options: --user 0:0
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare addon directory
        run: |
          mkdir -p /tmp/odoo-addons/aos_construction_management
          cp -a . /tmp/odoo-addons/aos_construction_management/
          chown -R odoo:odoo /tmp/odoo-addons

      - name: Install module on a fresh database
        run: |
          su -s /bin/bash odoo -c "odoo \
            --db_host=postgres \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --database=odoo19_construction_test \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/tmp/odoo-addons,/tmp/odoo-addons/aos_construction_management/extra_addons \
            --init=aos_construction_management,agreement \
            --test-enable \
            --stop-after-init \
            --log-level=test"
